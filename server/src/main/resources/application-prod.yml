spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  output:
    ansi:
      enabled: never

logging:
  level:
    root: INFO
    com.green.imagecore: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always


server:
  port: 8080