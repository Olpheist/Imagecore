[build-system]
requires = ["setuptools>=68", "wheel"]

[project]
name = "otsu-threshold"
version = "0.1.0"
description = "Segment MRI volumes via Otsu thresholding and produce a masked intensity image with a PDF report."
requires-python = ">=3.10"

dependencies = [
    "itk==5.4.0",
    "numpy>=1.24,<2.0",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "boto3>=1.34",
    "pydicom>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
otsu-threshold = "otsu_threshold.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
