spring:
  datasource:
    # if these env vars aren't provided (like in docker-compose) fall back to defaults
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imagecore}
    username: ${SPRING_DATASOURCE_USERNAME:imagecore}
    password: ${SPRING_DATASOURCE_PASSWORD:imagecore}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/dev
app:
  base-url: http://localhost:3000