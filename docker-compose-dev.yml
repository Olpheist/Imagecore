services:
  application:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: imagecore-dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/imagecore
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: imagecore-dev-db
    environment:
      POSTGRES_DB: imagecore
      POSTGRES_USER: imagecore
      POSTGRES_PASSWORD: imagecore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

networks:
  imagecore-network:
    name: imagecore-network
    driver: bridge