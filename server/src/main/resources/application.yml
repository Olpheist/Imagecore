server:
  port: 8080

spring:
  application:
    name: imagecore
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 50MB # max size for a single uploaded file
      max-request-size: 500MB # max size for entire HTTP request, covers a batch upload with multiple files
  output:
    ansi:
      enabled: always
logging:
  level:
    root: INFO
    com.green.imagecore: DEBUG
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.web.FilterChainProxy: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%clr([%d{HH:mm:ss.SSS}]){faint} %clr(%-5level){bold} %clr([%X{user:-\\}]){yellow} %clr(%logger){cyan} - %msg%n"
app:
  send-grid:
    api-key: disabled
  jwt:
    # Use a secure, 32+ character string in production
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long-for-hmac}
    issuer: imagecore
    access-ttl-minutes: 60
    refresh-ttl-days: 7
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:local-dev-bucket}
    health-imaging:
      datastore-id: ${AWS_HEALTH_IMAGING_DATASTORE_ID:local-dev-datastore}
      import-role-arn: ${AWS_HEALTH_IMAGING_IMPORT_ROLE_ARN:local-dev-role}