spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  output:
    ansi:
      enabled: never

logging:
  level:
    root: INFO
    com.green.imagecore: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

app:
  base-url: https://imagecore-dev-alb-854219521.us-east-1.elb.amazonaws.com/
  send-grid:
    api-key: ${SEND_GRID_API_KEY}
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME}

server:
  port: 8080